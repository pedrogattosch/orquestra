<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script>
(() => {
  // ---------------------------------------------------------------- estado
  const IDLE_MS = 2500;        // sem saída por esse tempo => "parado"
  const WORKED_MS = 5000;      // agente que trabalhou ao menos isso e parou => avisa
  const SVG = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const viewport = $('#viewport');
  const tabsEl = $('#tabs');
  const app = window.orquestra; // funções do aplicativo desktop (preload)
  const sessions = new Map();  // id -> { id, name, view, arrows, world, svg, tab }
  const nodes = new Map();     // id do terminal -> objeto do nó
  let active = null;           // id da sessão visível
  let defaults = { home: '' };
  let topZ = 1;
  let pendingFocus = null;
  let pendingNote = null;

  const ICON = (d, extra = '') => `<svg class="i" viewBox="0 0 16 16"${extra}>${d}</svg>`;
  const ICONS = {
    vscode: ICON('<path d="M6 4L2 8l4 4M10 4l4 4-4 4"/>'),
    expand: ICON('<path d="M10 2h4v4M6 14H2v-4M14 2L9.5 6.5M2 14l4.5-4.5"/>'),
    collapse: ICON('<path d="M14 6h-4V2M2 10h4v4M10 6l4.5-4.5M6 10l-4.5 4.5"/>'),
    close: ICON('<path d="M4 4l8 8M12 4l-8 8"/>'),
    check: ICON('<path d="M3 8.5l3 3 7-7"/>', ' style="stroke-width:1.8"'),
  };

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || `Erro ${res.status}`), data);
    return data;
  }

  const cur = () => sessions.get(active);
  const sessionNodes = (s) => [...nodes.values()].filter((n) => n.session === s);

  // ---------------------------------------------------------------- tema
  const THEME_KEY = 'orquestra.theme';
  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  let themePref = 'system';
  try { themePref = localStorage.getItem(THEME_KEY) || 'system'; } catch {}

  const XTERM_THEMES = {
    light: {
      background: '#FFFFFF', foreground: '#2A2A28', cursor: '#3B5BDB', cursorAccent: '#FFFFFF', selectionBackground: '#C9D3F5',
      black: '#191918', red: '#B8332F', green: '#1A7F46', yellow: '#8A6216', blue: '#3B5BDB', magenta: '#8B3FBF', cyan: '#0E7490', white: '#6B6B66',
      brightBlack: '#8A8A85', brightRed: '#D93F3A', brightGreen: '#1F9D55', brightYellow: '#B7791F', brightBlue: '#4F6BE0',
      brightMagenta: '#A855F7', brightCyan: '#0891B2', brightWhite: '#3D3D3A',
    },
    dark: {
      background: '#151517', foreground: '#D4D4D2', cursor: '#8EA2FF', cursorAccent: '#151517', selectionBackground: '#3A4680',
      black: '#26262A', red: '#FF7A75', green: '#4ADE80', yellow: '#F0B03C', blue: '#8EA2FF', magenta: '#D19BFF', cyan: '#5ED3E8', white: '#D4D4D2',
      brightBlack: '#6B6B70', brightRed: '#FF9C98', brightGreen: '#7EEBA6', brightYellow: '#F7C76A', brightBlue: '#B3C1FF',
      brightMagenta: '#E2BDFF', brightCyan: '#8FE3F2', brightWhite: '#FFFFFF',
    },
  };
  const resolvedTheme = () => (themePref === 'dark' || (themePref === 'system' && darkQuery.matches) ? 'dark' : 'light');

  function applyTheme() {
    const t = resolvedTheme();
    document.documentElement.dataset.theme = t;
    for (const b of document.querySelectorAll('[data-theme-pref]')) b.setAttribute('aria-pressed', String(b.dataset.themePref === themePref));
    for (const n of nodes.values()) n.term.options.theme = XTERM_THEMES[t];
  }
  function setThemePref(p) {
    themePref = p;
    try { localStorage.setItem(THEME_KEY, p); } catch {}
    applyTheme();
  }
  $('#themeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-theme-pref]');
    if (b) setThemePref(b.dataset.themePref);
  });
  darkQuery.addEventListener('change', () => { if (themePref === 'system') applyTheme(); });
  applyTheme();

  // ---------------------------------------------------------------- câmera
  function applyView() {
    const s = cur();
    if (!s) return;
    const view = s.view;
    s.world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
    const g = 22 * view.s;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${view.x}px ${view.y}px`;
    $('#zoomLabel').textContent = Math.round(view.s * 100) + '%';
  }

  let viewTimer = null;
  function saveView() {
    const s = cur();
    clearTimeout(viewTimer);
    viewTimer = setTimeout(() => api('PATCH', `/api/sessions/${s.id}`, { view: s.view }).catch(() => {}), 500);
  }

  function zoomAt(factor, cx, cy) {
    const view = cur().view;
    const s = Math.min(2, Math.max(0.2, view.s * factor));
    const k = s / view.s;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.s = s;
    applyView(); saveView();
  }

  const onBackground = (t) => t === viewport || t.classList.contains('world');

  // arrastar o fundo = mover a tela
  viewport.addEventListener('pointerdown', (e) => {
    if (!onBackground(e.target) || (e.button !== 0 && e.button !== 1)) return;
    const view = cur().view;
    const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
    const move = (ev) => { view.x = ox + ev.clientX - sx; view.y = oy + ev.clientY - sy; applyView(); };
    const up = () => {
      viewport.classList.remove('panning');
      viewport.removeEventListener('pointermove', move);
      viewport.removeEventListener('pointerup', up);
      saveView();
    };
    viewport.addEventListener('pointermove', move);
    viewport.addEventListener('pointerup', up);
  });

  // roda do mouse no fundo = zoom; dentro do terminal = rolar o terminal (Ctrl+roda dá zoom em qualquer lugar)
  window.addEventListener('wheel', (e) => {
    if (!cur() || (!onBackground(e.target) && !e.ctrlKey)) return;
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  function fitAll() {
    const s = cur();
    const list = sessionNodes(s);
    const view = s.view;
    if (!list.length) { Object.assign(view, { x: 0, y: 0, s: 1 }); applyView(); saveView(); return; }
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const { cfg: c } of list) {
      x1 = Math.min(x1, c.x); y1 = Math.min(y1, c.y);
      x2 = Math.max(x2, c.x + c.w); y2 = Math.max(y2, c.y + c.h);
    }
    // deixa espaço para os controles flutuantes de baixo
    const pad = 80, W = viewport.clientWidth, H = viewport.clientHeight - 70;
    view.s = Math.min(1, Math.max(0.2, Math.min((W - pad) / (x2 - x1), (H - pad) / (y2 - y1))));
    view.x = (W - (x2 - x1) * view.s) / 2 - x1 * view.s;
    view.y = (H - (y2 - y1) * view.s) / 2 - y1 * view.s;
    applyView(); saveView();
  }

  function focusNode(n) {
    if (n.session.id !== active) switchTo(n.session.id);
    const view = n.session.view;
    view.s = 1;
    view.x = viewport.clientWidth / 2 - (n.cfg.x + n.cfg.w / 2);
    view.y = viewport.clientHeight / 2 - (n.cfg.y + n.cfg.h / 2);
    applyView(); saveView();
    activate(n); n.term.focus();
  }

  // ---------------------------------------------------------------- sessões (abas)
  function makeSession(data) {
    const world = document.createElement('div');
    world.className = 'world';
    const svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'arrows');
    world.appendChild(svg);
    viewport.appendChild(world);

    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.innerHTML = `<span class="tname"></span><span class="adot" title="Um terminal desta sessão precisa de você"></span><button class="tclose" title="Fechar sessão" aria-label="Fechar sessão">${ICONS.close}</button>`;
    tabsEl.insertBefore(tab, $('#btnAddSession'));

    const s = { id: data.id, name: data.name, view: { ...data.view }, arrows: data.arrows, notes: new Map(), world, svg, tab };
    sessions.set(s.id, s);

    const nameEl = tab.querySelector('.tname');
    tab.title = 'Clique duplo para renomear';
    tab.addEventListener('click', (e) => { if (!e.target.closest('button') && !nameEl.isContentEditable) switchTo(s.id); });
    tab.addEventListener('dblclick', (e) => {
      if (!e.target.closest('button')) startRename(nameEl, (name) => api('PATCH', `/api/sessions/${s.id}`, { name }));
    });
    tab.querySelector('.tclose').addEventListener('click', () => {
      const k = s.notes.size;
      if (k && !confirm(`Fechar a sessão "${s.name}" apaga ${k === 1 ? 'a anotação dela' : `as ${k} anotações dela`}. Continuar?`)) return;
      api('DELETE', `/api/sessions/${s.id}`).catch((err) => toast(err.message));
    });
    return s;
  }

  function switchTo(id, remember = true) {
    if (!sessions.has(id)) return;
    for (const n of nodes.values()) if (n.expanded && n.session.id !== id) setExpanded(n, false);
    active = id;
    if (mode) setMode(null);
    for (const s of sessions.values()) {
      s.world.classList.toggle('active', s.id === id);
      s.tab.classList.toggle('active', s.id === id);
    }
    applyView(); updateEmpty(); updateSummary();
    if (remember) api('PUT', '/api/active', { id }).catch(() => {});
  }

  const TAB_TITLE = { alert: 'Um terminal desta sessão precisa de você', working: 'Trabalhando', idle: 'Parada' };
  function updateTabs() {
    for (const s of sessions.values()) {
      const list = sessionNodes(s);
      const st = list.some((n) => n.alert) ? 'alert' : list.some((n) => n.status === 'working') ? 'working'
        : list.some((n) => n.status === 'idle') ? 'idle' : '';
      s.tab.classList.toggle('alert', st === 'alert');
      s.tab.classList.toggle('st-working', st === 'working');
      s.tab.classList.toggle('st-idle', st === 'idle');
      s.tab.querySelector('.adot').title = TAB_TITLE[st] || '';
      s.tab.querySelector('.tclose').hidden = sessions.size === 1;
    }
    const waiting = [...nodes.values()].filter((n) => n.alert).length;
    document.title = waiting ? `(${waiting}) Orquestra` : 'Orquestra';
    updateSummary();
  }

  // resumo no canto: quantos terminais da sessão estão em cada estado
  function updateSummary() {
    const s = cur();
    const list = s ? sessionNodes(s) : [];
    const count = (st) => list.filter((n) => n.status === st).length;
    const put = (id, k, label) => {
      const el = $(id);
      el.hidden = !k;
      el.querySelector('b').textContent = `${k} ${label}`;
    };
    put('#sumWorking', count('working'), 'trabalhando');
    put('#sumIdle', count('idle'), count('idle') === 1 ? 'parado' : 'parados');
    put('#sumAlert', count('alert'), count('alert') === 1 ? 'precisa de você' : 'precisam de você');
  }

  // Aplica o estado enviado pelo servidor. Posições de terminais já abertos ficam com a janela,
  // para não "pular" enquanto a pessoa arrasta.
  function reconcile(st) {
    const ids = new Set(st.sessions.map((s) => s.id));
    for (const s of [...sessions.values()]) {
      if (!ids.has(s.id)) { s.world.remove(); s.tab.remove(); sessions.delete(s.id); }
    }
    const termIds = new Set();
    for (const data of st.sessions) {
      const s = sessions.get(data.id) || makeSession(data);
      s.name = data.name;
      s.arrows = data.arrows;
      s.project = data.project || '';
      const nameEl = s.tab.querySelector('.tname');
      if (!nameEl.isContentEditable) nameEl.textContent = data.name;
      for (const cfg of data.terminals) {
        termIds.add(cfg.id);
        const n = nodes.get(cfg.id);
        if (!n) makeNode(cfg, s);
        else {
          Object.assign(n.cfg, { name: cfg.name, branch: cfg.branch });
          if (!n.nameEl.isContentEditable) n.nameEl.textContent = cfg.name;
          n.subEl.textContent = subtitle(cfg);
        }
      }
    }
    for (const n of [...nodes.values()]) if (!termIds.has(n.cfg.id)) disposeNode(n);
    for (const data of st.sessions) renderNotes(sessions.get(data.id), data.notes || []);
    if (!active || !sessions.has(active)) switchTo(st.activeSession, false);
    for (const s of sessions.values()) drawArrows(s);
    updateTabs(); updateEmpty();
  }

  // ---------------------------------------------------------------- nós
  const AGENT_LABEL = { claude: 'claude', codex: 'codex', gemini: 'gemini', antigravity: 'antigravity' };
  const subtitle = (cfg) => [shortPath(cfg.cwd), cfg.branch, AGENT_LABEL[cfg.agent] || 'terminal'].filter(Boolean).join(' · ');
  // terminal sem nome é identificado pelo caminho onde for preciso citá-lo
  const label = (cfg) => cfg.name || subtitle(cfg);

  function place(n) {
    const { x, y, w, h } = n.cfg;
    Object.assign(n.el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    drawArrows(n.session);
  }

  function activate(n) {
    for (const o of nodes.values()) o.el.classList.toggle('active', o === n);
    n.el.style.zIndex = ++topZ;
    if (n.alert) setAlert(n, false);
  }

  function refit(n) {
    try {
      n.fit.fit();
      send(n, { t: 'resize', cols: n.term.cols, rows: n.term.rows });
    } catch {}
  }

  function send(n, msg) { if (n.ws && n.ws.readyState === 1) n.ws.send(JSON.stringify(msg)); }

  const STATE_LABEL = { working: 'trabalhando', idle: 'parado', alert: 'precisa de você', dead: 'encerrado', connecting: 'conectando…' };
  function setStatus(n, s) {
    const changed = n.status !== s;
    n.status = s;
    n.dot.className = 'status ' + s;
    n.stateEl.className = 'state ' + s;
    n.stateEl.textContent = STATE_LABEL[s] || '';
    if (changed) updateTabs();
  }

  function setAlert(n, on) {
    n.alert = on;
    n.el.classList.toggle('alert', on);
    setStatus(n, on ? 'alert' : (n.status === 'alert' ? 'idle' : n.status));
    updateTabs();
  }

  function startRename(el, save) {
    if (el.isContentEditable) return;
    const old = el.textContent;
    el.contentEditable = 'true'; el.focus();
    document.getSelection().selectAllChildren(el);
    const done = () => {
      el.contentEditable = 'false';
      el.removeEventListener('blur', done);
      const name = el.textContent.trim();
      el.textContent = name || old;
      if (name && name !== old) save(name).catch((err) => { el.textContent = old; toast(err.message); });
    };
    el.addEventListener('blur', done);
    el.addEventListener('keydown', function key(e) {
      if (e.key === 'Enter') { e.preventDefault(); el.removeEventListener('keydown', key); el.blur(); }
      if (e.key === 'Escape') { el.textContent = old; el.removeEventListener('keydown', key); el.blur(); }
    });
  }

  // O xterm não sabe do zoom do quadro (transform: scale): mede o mouse em pixels da tela e divide
  // pelo tamanho da letra sem zoom, então a seleção começava longe de onde se clicou. Aqui as
  // coordenadas do mouse são desfeitas do zoom antes de o xterm usá-las (API interna do xterm 5).
  function fixMouseForZoom(term) {
    const ms = term._core && term._core._mouseService;
    if (!ms || !ms.getCoords || !ms.getMouseReportCoords) return;
    const unzoom = (e, el) => {
      const r = el.getBoundingClientRect();
      const s = el.offsetWidth ? r.width / el.offsetWidth : 1;
      if (!s || Math.abs(s - 1) < 0.001) return e;
      return { clientX: r.left + (e.clientX - r.left) / s, clientY: r.top + (e.clientY - r.top) / s };
    };
    const getCoords = ms.getCoords.bind(ms), getReport = ms.getMouseReportCoords.bind(ms);
    ms.getCoords = (e, el, ...rest) => getCoords(unzoom(e, el), el, ...rest);
    ms.getMouseReportCoords = (e, el) => getReport(unzoom(e, el), el);
  }

  function makeNode(cfg, session) {
    const el = document.createElement('section');
    el.className = 'node';
    el.innerHTML = `
      <div class="head">
        <span class="status"></span>
        <div class="title"><span class="name"></span><span class="sub"></span></div>
        <span class="state"></span>
        <div class="acts">
          <button class="ghost" data-a="expand" title="Abrir o terminal na tela toda">${ICONS.expand}<span>Expandir</span></button>
          <button class="ghost" data-a="vscode" title="Abrir a pasta no VS Code para ver as mudanças">${ICONS.vscode}Abrir</button>
          <button class="ghost" data-a="finish" title="Fechar o terminal">${ICONS.close}Finalizar</button>
        </div>
      </div>
      <div class="body"></div>
      <div class="grip"></div>`;
    session.world.appendChild(el);

    const term = new Terminal({
      fontFamily: 'ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace',
      fontSize: 13, lineHeight: 1.15, cursorBlink: true, allowProposedApi: true, scrollback: 5000,
      // agentes com tema escuro mandam cores fixas que somem no fundo claro; o xterm as ajusta para ficarem legíveis
      minimumContrastRatio: 4.5,
      theme: XTERM_THEMES[resolvedTheme()],
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(el.querySelector('.body'));

    const n = {
      cfg: { ...cfg }, session, el, term, fit, ws: null, alert: false, status: 'connecting', lastOut: 0,
      dot: el.querySelector('.status'), stateEl: el.querySelector('.state'),
      nameEl: el.querySelector('.name'), subEl: el.querySelector('.sub'),
    };
    n.nameEl.textContent = cfg.name;
    n.subEl.textContent = subtitle(cfg);
    el.setAttribute('aria-label', `Terminal ${label(cfg)}`);
    nodes.set(cfg.id, n);
    place(n);

    term.onData((d) => {
      if (n.status === 'dead') { if (d === '\r') restart(n); return; }
      send(n, { t: 'in', d });
      if (n.alert) setAlert(n, false);
    });
    term.onBell(() => notify(n)); // agentes podem tocar o "sino" quando precisam de você
    // ...ou mandar uma notificação por sequência de escape (OSC 9 do iTerm2, 777 do Ghostty, 99 do kitty)
    for (const code of [9, 777, 99]) term.parser.registerOscHandler(code, () => { notify(n); return true; });
    // Copiar pelo programa (OSC 52, usado pelo /copy do Claude Code): "c;<texto em base64>".
    // O xterm não trata essa sequência sozinho.
    term.parser.registerOscHandler(52, (data) => {
      const b64 = data.slice(data.indexOf(';') + 1);
      if (!b64 || b64 === '?') return true; // pedido de leitura da área de transferência: não é atendido
      try {
        const text = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
        navigator.clipboard.writeText(text).catch(() => toast('Não consegui copiar o texto.'));
      } catch { toast('Não consegui copiar o texto.'); }
      return true;
    });
    fixMouseForZoom(term);

    // Copiar e colar como num editor. Sozinho, o xterm transforma Ctrl+C e Ctrl+V em ^C e ^V e nunca
    // copia nem cola. Ctrl+C copia quando há seleção (sem seleção, continua interrompendo); Ctrl+V
    // deixa o navegador disparar o "paste", tratado pelo xterm (texto) ou abaixo (imagem).
    // Ctrl+Shift+C e Ctrl+Shift+V também valem, como nos terminais do Linux.
    // Ctrl+Enter manda uma quebra de linha (\n), que o Claude Code e o Codex usam para pular linha sem
    // enviar; sozinho, o xterm o manda como Enter. O Ctrl+J, que manda o mesmo \n, fica desligado para
    // pular linha ser só com Ctrl+Enter.
    term.attachCustomKeyEventHandler((e) => {
      if (!e.ctrlKey || e.altKey || e.metaKey) return true;
      if (e.key === 'Enter' && !e.shiftKey) {
        if (e.type === 'keydown') { e.preventDefault(); term.input('\n'); }
        return false;
      }
      const k = e.key.toLowerCase();
      if (k === 'j' && !e.shiftKey) { if (e.type === 'keydown') e.preventDefault(); return false; }
      if (k === 'v') return false;
      if (k === 'c' && (e.shiftKey || term.hasSelection())) {
        if (e.type === 'keydown') {
          e.preventDefault();
          const text = term.getSelection();
          if (text) navigator.clipboard.writeText(text).catch(() => toast('Não consegui copiar o texto.'));
          if (!e.shiftKey) term.clearSelection();
        }
        return false;
      }
      return true;
    });

    // Ctrl+V com um print: o xterm só cola texto. A imagem vira um arquivo temporário e o caminho
    // é colado no terminal, como ao arrastar uma imagem; o Claude Code o transforma em [Image #1].
    el.addEventListener('paste', (e) => {
      const items = [...(e.clipboardData ? e.clipboardData.items : [])];
      const image = items.find((i) => i.kind === 'file' && i.type.startsWith('image/'));
      if (!image || items.some((i) => i.type === 'text/plain')) return; // texto continua com o xterm
      e.preventDefault();
      e.stopPropagation();
      const file = image.getAsFile();
      fetch(`/api/terminals/${cfg.id}/print`, { method: 'POST', headers: { 'Content-Type': file.type }, body: file })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Erro ${res.status}`);
          term.paste(data.path);
        })
        .catch((err) => toast(`Não consegui colar a imagem: ${err.message}`));
    }, true);

    // o arrasto captura o ponteiro no cabeçalho, então o duplo clique chega a ele e não ao nome
    el.querySelector('.head').addEventListener('dblclick', (e) => {
      if (!e.target.closest('button')) startRename(n.nameEl, (name) => api('PATCH', `/api/terminals/${cfg.id}`, { name }));
    });

    el.querySelector('.head').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-a]');
      const a = b && b.dataset.a;
      if (a === 'expand') setExpanded(n, !n.expanded);
      if (a === 'finish') openFinish(n);
      if (a === 'vscode') api('POST', `/api/terminals/${cfg.id}/vscode`).catch((err) => toast(err.message));
    });

    el.addEventListener('pointerdown', () => activate(n), true);

    // arrastar pelo cabeçalho
    el.querySelector('.head').addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.isContentEditable || n.expanded) return;
      dragWith(e, (dx, dy, o) => { n.cfg.x = o.x + dx; n.cfg.y = o.y + dy; place(n); }, { x: n.cfg.x, y: n.cfg.y },
        () => api('PATCH', `/api/terminals/${cfg.id}`, { x: n.cfg.x, y: n.cfg.y }).catch(() => {}));
    });

    // redimensionar pelo canto
    el.querySelector('.grip').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      dragWith(e, (dx, dy, o) => {
        n.cfg.w = Math.max(320, o.w + dx); n.cfg.h = Math.max(200, o.h + dy); place(n); refit(n);
      }, { w: n.cfg.w, h: n.cfg.h }, () => api('PATCH', `/api/terminals/${cfg.id}`, { w: n.cfg.w, h: n.cfg.h }).catch(() => {}));
    });

    new ResizeObserver(() => refit(n)).observe(el.querySelector('.body'));
    connect(n);
    if (pendingFocus === cfg.id) { pendingFocus = null; switchTo(session.id); activate(n); term.focus(); }
    return n;
  }

  function setExpanded(n, on) {
    n.expanded = on;
    n.el.classList.toggle('expanded', on);
    // fora do quadro, o position: fixed vale para a janela e não para o quadro com zoom
    (on ? document.body : n.session.world).appendChild(n.el);
    const b = n.el.querySelector('[data-a="expand"]');
    b.innerHTML = `${on ? ICONS.collapse : ICONS.expand}<span>${on ? 'Recolher' : 'Expandir'}</span>`;
    b.title = on ? 'Voltar o terminal para o quadro' : 'Abrir o terminal na tela toda';
    if (on) { activate(n); n.term.focus(); }
  }

  function restart(n) {
    n.term.reset();
    api('POST', `/api/terminals/${n.cfg.id}/restart`)
      .then(() => { if (!n.ws || n.ws.readyState > 1) connect(n); else setStatus(n, 'working'); })
      .catch((err) => toast(err.message));
  }

  function disposeNode(n) {
    n.closing = true;
    try { n.ws && n.ws.close(); } catch {}
    n.term.dispose(); n.el.remove(); nodes.delete(n.cfg.id);
  }

  // arrasto que respeita o zoom atual
  function dragWith(e, onMove, origin, onEnd) {
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    const target = e.currentTarget;
    const view = cur().view;
    target.setPointerCapture(e.pointerId);
    const move = (ev) => onMove((ev.clientX - sx) / view.s, (ev.clientY - sy) / view.s, origin);
    const up = () => { target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up); onEnd(); };
    target.addEventListener('pointermove', move);
    target.addEventListener('pointerup', up);
  }

  function connect(n) {
    const ws = new WebSocket(`ws://${location.host}/term?id=${encodeURIComponent(n.cfg.id)}`);
    n.ws = ws;
    setStatus(n, 'connecting');
    ws.onopen = () => refit(n);
    ws.onmessage = (ev) => {
      if (n.ws !== ws) return;
      const m = JSON.parse(ev.data);
      if (m.t === 'out') {
        n.term.write(m.d);
        n.lastOut = Date.now();
        if (n.status !== 'working') n.workStart = n.lastOut;
        if (!n.alert) setStatus(n, 'working');
      } else if (m.t === 'exit') {
        n.term.write(`\r\n\x1b[90m[processo encerrado — aperte Enter para reiniciar]\x1b[0m\r\n`);
        setStatus(n, 'dead');
      }
    };
    ws.onclose = () => { if (n.ws === ws && !n.closing && n.status !== 'dead') setStatus(n, 'dead'); };
  }

  // Um terminal precisa de você: marca o alerta, mostra o aviso no canto e, com a janela fora de foco,
  // também a notificação do sistema. Não avisa sobre o terminal que você está usando nem avisa duas vezes.
  function notify(n, msg = 'precisa de você') {
    if (n.alert || n.status === 'dead') return;
    if (document.hasFocus() && n.session.id === active && n.el.classList.contains('active')) return;
    setAlert(n, true);
    showNotice(n, msg);
    if (!document.hasFocus() && 'Notification' in window && Notification.permission !== 'denied') {
      const note = new Notification('Orquestra', { body: `${label(n.cfg)} ${msg} (${n.session.name})` });
      note.onclick = () => { if (app) app.show(); focusNode(n); };
    }
  }

  // aviso pequeno no canto: clicar leva à sessão e ao terminal; some sozinho depois de alguns segundos
  const NOTICE_MS = 6000;
  function showNotice(n, msg) {
    const box = $('#notices');
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'notice';
    el.innerHTML = '<span class="ndot"></span><span class="ntext"><b></b><span></span></span>';
    el.querySelector('b').textContent = `${label(n.cfg)} ${msg}`;
    el.querySelector('.ntext span').textContent = n.session.name;
    const close = () => el.remove();
    el.onclick = () => { close(); if (nodes.get(n.cfg.id) === n) focusNode(n); };
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(close, NOTICE_MS);
  }

  // de tempos em tempos, quem parou de imprimir vira "parado"
  setInterval(() => {
    const now = Date.now();
    for (const n of nodes.values()) {
      if (n.status !== 'working' || now - n.lastOut <= IDLE_MS) continue;
      setStatus(n, 'idle');
      if (n.cfg.agent && n.lastOut - n.workStart >= WORKED_MS) notify(n, 'terminou ou precisa de você');
    }
  }, 500);

  // ---------------------------------------------------------------- conexões (setas)
  // ponto na borda do retângulo R na direção do centro de T
  function edge(R, T) {
    const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
    const dx = T.x + T.w / 2 - cx, dy = T.y + T.h / 2 - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    const t = Math.min(R.w / 2 / Math.abs(dx || 1e-9), R.h / 2 / Math.abs(dy || 1e-9));
    return { x: cx + dx * t, y: cy + dy * t };
  }

  function drawArrows(s) {
    if (!s) return;
    s.svg.querySelectorAll('g').forEach((g) => g.remove());
    for (const a of s.arrows) {
      const A = nodes.get(a.from), B = nodes.get(a.to);
      if (!A || !B) continue;
      const p = edge(A.cfg, B.cfg), q = edge(B.cfg, A.cfg);
      const g = document.createElementNS(SVG, 'g');
      g.setAttribute('class', `arrow ${a.type}`);
      for (const cls of ['hit', 'vis']) {
        const line = document.createElementNS(SVG, 'line');
        line.setAttribute('class', cls);
        line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
        line.setAttribute('x2', q.x); line.setAttribute('y2', q.y);
        if (cls === 'vis') line.setAttribute('marker-end', `url(#m-${a.type})`);
        g.appendChild(line);
      }
      const title = document.createElementNS(SVG, 'title');
      title.textContent = a.type === 'comando'
        ? `${label(A.cfg)} comanda ${label(B.cfg)}`
        : `${label(A.cfg)} depende de ${label(B.cfg)}`;
      g.appendChild(title);
      g.addEventListener('click', (e) => openArrowMenu(a, e));
      s.svg.appendChild(g);
    }
  }

  const menu = $('#arrowMenu');
  let menuArrow = null;
  function openArrowMenu(a, e) {
    menuArrow = a;
    Object.assign(menu.style, { display: 'flex', left: e.clientX + 'px', top: e.clientY + 'px' });
  }
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || !menuArrow) return;
    const req = b.hasAttribute('data-remove')
      ? api('DELETE', `/api/arrows/${menuArrow.id}`)
      : api('PATCH', `/api/arrows/${menuArrow.id}`, { type: b.dataset.type });
    req.catch((err) => toast(err.message));
    menu.style.display = 'none';
  });
  window.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) menu.style.display = 'none'; });

  // ---------------------------------------------------------------- anotações
  // Texto escrito direto no quadro, que cresce conforme se escreve. Como nos terminais, a posição de uma
  // anotação já aberta fica com a janela. O texto é uma lista de trechos { t, size, color }: cada parte
  // tem tamanho e cor próprios e nada de HTML é guardado.
  const NOTE_COLORS = { tinta: 'var(--text)', azul: 'var(--accent)', vermelho: 'var(--alert-text)', verde: 'var(--ok-text)', laranja: 'var(--dep-text)' };
  const NOTE_SIZES = [{ size: 18, label: 'P' }, { size: 26, label: 'M' }, { size: 40, label: 'G' }];
  const noteStyle = { size: 26, color: 'tinta' }; // o que a barra mostra: estilo da próxima anotação ou do texto no cursor
  let focusedNote = null;

  const runsText = (runs) => runs.map((r) => r.t).join('');
  function mergeRuns(runs) {
    const out = [];
    for (const r of runs) {
      if (!r.t) continue;
      const last = out[out.length - 1];
      if (last && last.size === r.size && last.color === r.color) last.t += r.t; else out.push({ ...r });
    }
    return out;
  }
  // trechos entre as posições a e b do texto
  function sliceRuns(runs, a, b) {
    const out = [];
    let pos = 0;
    for (const r of runs) {
      const from = Math.max(a, pos), to = Math.min(b, pos + r.t.length);
      if (from < to) out.push({ ...r, t: r.t.slice(from - pos, to - pos) });
      pos += r.t.length;
    }
    return out;
  }
  // estilo do caractere antes do cursor, que é o que o texto digitado ali herda
  function styleBefore(runs, pos, base) {
    let p = 0;
    const i = Math.max(0, pos - 1);
    for (const r of runs) {
      if (i < p + r.t.length) return { size: r.size, color: r.color };
      p += r.t.length;
    }
    return base;
  }

  const noteBase = (note) => ({ size: note.cfg.size, color: note.cfg.color });

  // lê os trechos de um pedaço do texto (o próprio texto ou uma cópia parcial dele)
  function walkRuns(root, base) {
    const runs = [];
    const walk = (node, style) => {
      for (const ch of node.childNodes) {
        if (ch.nodeType === 3) runs.push({ t: ch.data, ...style });
        else if (ch.nodeName === 'BR') { if (!ch.classList.contains('end')) runs.push({ t: '\n', ...style }); }
        else if (ch.nodeType === 1) {
          const st = ch.dataset.size ? { size: +ch.dataset.size, color: ch.dataset.color } : style;
          if (/^(DIV|P)$/.test(ch.nodeName) && runs.length) runs.push({ t: '\n', ...st });
          walk(ch, st);
        }
      }
    };
    walk(root, base);
    return mergeRuns(runs);
  }
  const readRuns = (note) => walkRuns(note.text, noteBase(note));

  function renderRuns(note, runs) {
    const els = runs.map((r) => {
      const span = document.createElement('span');
      span.dataset.size = r.size;
      span.dataset.color = r.color;
      span.style.fontSize = r.size + 'px';
      span.style.color = NOTE_COLORS[r.color] || NOTE_COLORS.tinta;
      span.textContent = r.t;
      return span;
    });
    // uma quebra de linha no fim só aparece se vier algo depois dela
    if (runsText(runs).endsWith('\n')) els.push(Object.assign(document.createElement('br'), { className: 'end' }));
    note.text.replaceChildren(...els);
  }

  function styleNoteBase(note) {
    note.text.style.fontSize = note.cfg.size + 'px';
    note.text.style.color = NOTE_COLORS[note.cfg.color] || NOTE_COLORS.tinta;
  }

  // posição do cursor (ou da seleção) contada em caracteres do texto
  function caretOffsets(note) {
    const sel = getSelection();
    if (!sel.rangeCount || !note.text.contains(sel.anchorNode)) return null;
    const r = sel.getRangeAt(0);
    const upTo = (node, offset) => {
      const pre = document.createRange();
      pre.setStart(note.text, 0);
      pre.setEnd(node, offset);
      return runsText(walkRuns(pre.cloneContents(), noteBase(note))).length;
    };
    return { start: upTo(r.startContainer, r.startOffset), end: upTo(r.endContainer, r.endOffset) };
  }

  function setSelection(note, a, b = a) {
    const at = (target) => {
      const walker = document.createTreeWalker(note.text, NodeFilter.SHOW_TEXT);
      let p = 0, last = null;
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        if (target <= p + n.data.length) return [n, target - p];
        p += n.data.length;
        last = n;
      }
      return last ? [last, last.data.length] : [note.text, 0];
    };
    const r = document.createRange();
    r.setStart(...at(a));
    r.setEnd(...at(b));
    getSelection().removeAllRanges();
    getSelection().addRange(r);
  }

  // edita os trechos e redesenha o texto, mantendo o cursor no lugar
  function editNote(note, fn) {
    const runs = readRuns(note);
    const len = runsText(runs).length;
    const off = caretOffsets(note) || { start: len, end: len };
    const res = fn(runs, off);
    renderRuns(note, mergeRuns(res.runs));
    setSelection(note, res.start, res.end);
    note.save();
  }

  // texto digitado: herda o estilo de antes do cursor, com o que foi escolhido na barra por cima
  function insertInNote(note, str) {
    editNote(note, (runs, { start, end }) => {
      const style = { ...styleBefore(runs, start, noteBase(note)), ...note.pending };
      note.pending = null;
      return {
        runs: [...sliceRuns(runs, 0, start), { t: str, ...style }, ...sliceRuns(runs, end, Infinity)],
        start: start + str.length,
        end: start + str.length,
      };
    });
  }

  function restyleSelection(note, patch) {
    editNote(note, (runs, { start, end }) => ({
      runs: [...sliceRuns(runs, 0, start), ...sliceRuns(runs, start, end).map((r) => ({ ...r, ...patch })), ...sliceRuns(runs, end, Infinity)],
      start,
      end,
    }));
  }

  function renderNotes(s, list) {
    const ids = new Set(list.map((c) => c.id));
    for (const [id, note] of s.notes) if (!ids.has(id)) { note.gone = true; note.el.remove(); s.notes.delete(id); }
    for (const c of list) {
      const note = s.notes.get(c.id) || makeNote(c, s);
      if (note === focusedNote) continue;
      Object.assign(note.cfg, { size: c.size, color: c.color });
      styleNoteBase(note);
      if (JSON.stringify(readRuns(note)) !== JSON.stringify(c.runs || [])) renderRuns(note, c.runs || []);
    }
  }

  function makeNote(c, s) {
    const el = document.createElement('div');
    el.className = 'note';
    el.innerHTML = `<div class="note-bar"><button class="icon-btn" title="Apagar anotação" aria-label="Apagar anotação">${ICONS.close}</button></div>
      <div class="note-text" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Anotação"></div>`;
    s.world.appendChild(el);
    const note = { cfg: { ...c }, el, text: el.querySelector('.note-text'), pending: null };
    s.notes.set(c.id, note);
    styleNoteBase(note);
    renderRuns(note, c.runs || []);
    const placeNote = () => Object.assign(el.style, { left: note.cfg.x + 'px', top: note.cfg.y + 'px' });
    placeNote();
    const patch = (body) => api('PATCH', `/api/notes/${c.id}`, body)
      .catch((err) => { if (!note.gone) toast(`A anotação não foi salva: ${err.message}`); });
    note.patch = patch;
    const remove = () => {
      if (note.gone) return; // o clique no ✕ também dispara o blur do texto
      note.gone = true;
      api('DELETE', `/api/notes/${c.id}`).catch((err) => { note.gone = false; toast(err.message); });
    };

    let typing = null;
    note.save = () => {
      clearTimeout(typing);
      typing = setTimeout(() => patch({ runs: readRuns(note) }), 400);
    };
    // quebras de linha, colagens e textos com estilo escolhido passam pelos trechos;
    // o resto da digitação o navegador faz direto no trecho em que está o cursor
    note.text.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); insertInNote(note, '\n'); }
      else if (e.inputType === 'insertText' && e.data && note.pending) { e.preventDefault(); insertInNote(note, e.data); }
    });
    note.text.addEventListener('paste', (e) => {
      e.preventDefault();
      const t = e.clipboardData.getData('text/plain');
      if (t) insertInNote(note, t);
    });
    note.text.addEventListener('drop', (e) => e.preventDefault());
    note.text.addEventListener('input', () => {
      if (!note.text.textContent) note.text.replaceChildren(); // volta a mostrar "Escreva aqui…"
      note.save();
    });
    note.text.addEventListener('focus', () => { focusedNote = note; syncNoteBar(); });
    // anotação deixada em branco some ao sair dela
    note.text.addEventListener('blur', () => {
      if (focusedNote === note) { focusedNote = null; renderNoteBar(); }
      note.pending = null;
      clearTimeout(typing);
      const runs = readRuns(note);
      if (!runsText(runs).trim()) remove(); else patch({ runs });
    });
    el.addEventListener('pointerdown', () => { el.style.zIndex = ++topZ; }, true);
    el.querySelector('.note-bar button').addEventListener('click', remove);
    el.querySelector('.note-bar').addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      dragWith(e, (dx, dy, o) => { note.cfg.x = o.x + dx; note.cfg.y = o.y + dy; placeNote(); }, { x: note.cfg.x, y: note.cfg.y },
        () => patch({ x: note.cfg.x, y: note.cfg.y }));
    });
    if (pendingNote === c.id) { pendingNote = null; note.text.focus(); }
    return note;
  }

  // a barra mostra o estilo do texto no cursor da anotação em edição
  function syncNoteBar() {
    const note = focusedNote;
    if (!note) return;
    const runs = readRuns(note);
    const off = caretOffsets(note);
    Object.assign(noteStyle, styleBefore(runs, off ? off.start + (off.start === off.end ? 0 : 1) : 0, noteBase(note)), note.pending);
    renderNoteBar();
  }
  document.addEventListener('selectionchange', syncNoteBar);

  // x e y: ponto do quadro em que a pessoa clicou; o texto começa ali
  async function addNote(x, y) {
    const s = cur();
    try {
      const c = await api('POST', '/api/notes', { sessionId: s.id, x: x - 12, y: y - 22 - noteStyle.size / 2, ...noteStyle });
      const note = s.notes.get(c.id);
      if (note) note.text.focus(); else pendingNote = c.id;
    } catch (err) { toast(err.message); }
  }

  // ---------------------------------------------------------------- modos: lápis e conectar
  // Com um modo ligado, o próximo clique no quadro escreve uma anotação ou escolhe os terminais da conexão.
  let mode = null; // 'note' | 'connect'
  let connFrom = null;
  let connType = 'comando';
  const noteBar = $('#noteBar'), connBar = $('#connBar');

  $('#noteSizes').innerHTML = NOTE_SIZES.map((o) =>
    `<button class="opt size" data-size="${o.size}" title="Tamanho ${o.label}" style="font-size:${Math.round(o.size * 0.7)}px">Aa</button>`).join('');
  $('#noteColors').innerHTML = Object.entries(NOTE_COLORS).map(([k, v]) =>
    `<button class="opt color" data-color="${k}" title="${k[0].toUpperCase() + k.slice(1)}" style="color:${v}"><span class="swatch" style="background:${v}"></span></button>`).join('');

  function renderNoteBar() {
    noteBar.hidden = mode !== 'note' && !focusedNote;
    for (const b of noteBar.querySelectorAll('[data-size]')) b.setAttribute('aria-pressed', String(+b.dataset.size === noteStyle.size));
    for (const b of noteBar.querySelectorAll('[data-color]')) b.setAttribute('aria-pressed', String(b.dataset.color === noteStyle.color));
  }

  function renderConnBar() {
    connBar.hidden = mode !== 'connect';
    for (const b of connBar.querySelectorAll('[data-type]')) b.setAttribute('aria-pressed', String(b.dataset.type === connType));
  }

  function pickFrom(n) {
    if (connFrom) connFrom.el.classList.remove('picked');
    connFrom = n;
    if (n) n.el.classList.add('picked');
  }

  function setMode(m) {
    if (m === 'connect' && sessionNodes(cur()).length < 2) return toast('A sessão precisa de pelo menos dois terminais para uma conexão.');
    mode = m;
    pickFrom(null);
    viewport.classList.toggle('mode-note', m === 'note');
    viewport.classList.toggle('mode-connect', m === 'connect');
    $('#btnNote').setAttribute('aria-pressed', String(m === 'note'));
    $('#btnConnect').setAttribute('aria-pressed', String(m === 'connect'));
    renderNoteBar(); renderConnBar();
  }

  // botões das barras não tiram o foco da anotação que está sendo editada
  for (const bar of [noteBar, connBar]) bar.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
  noteBar.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const style = b.dataset.size ? { size: +b.dataset.size } : { color: b.dataset.color };
    Object.assign(noteStyle, style);
    const note = focusedNote;
    if (note) {
      const off = caretOffsets(note);
      if (off && off.start !== off.end) restyleSelection(note, style); // trecho selecionado
      else note.pending = { ...note.pending, ...style };                // o que for digitado a seguir
      if (!note.text.textContent) {                                      // anotação vazia: muda o estilo inicial dela
        Object.assign(note.cfg, style);
        styleNoteBase(note);
        note.patch(style);
      }
    }
    renderNoteBar();
  });
  connBar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-type]');
    if (b) { connType = b.dataset.type; renderConnBar(); }
  });

  // em captura, para o clique não chegar ao terminal nem mover a tela
  viewport.addEventListener('pointerdown', (e) => {
    if (!mode || e.button !== 0) return;
    if (mode === 'note') {
      if (!onBackground(e.target)) return;
      e.preventDefault(); e.stopPropagation();
      const r = viewport.getBoundingClientRect(), view = cur().view;
      setMode(null);
      addNote((e.clientX - r.left - view.x) / view.s, (e.clientY - r.top - view.y) / view.s);
      return;
    }
    const el = e.target.closest('.node');
    const n = el && [...nodes.values()].find((x) => x.el === el);
    if (!n) return; // no fundo, o clique continua movendo a tela
    e.preventDefault(); e.stopPropagation();
    if (!connFrom || connFrom === n) { pickFrom(n); renderConnBar(); return; }
    const from = connFrom;
    setMode(null);
    api('POST', '/api/arrows', { from: from.cfg.id, to: n.cfg.id, type: connType }).catch((err) => toast(err.message));
  }, true);

  // ---------------------------------------------------------------- utilidades
  const shortPath = (p) => (defaults.home && (p || '').startsWith(defaults.home) ? '~' + p.slice(defaults.home.length) : p || '');
  const updateEmpty = () => { $('#empty').style.display = cur() && (sessionNodes(cur()).length || cur().notes.size) ? 'none' : 'grid'; };
  const basename = (p) => p.split(/[\\/]/).filter(Boolean).pop() || p;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 8000);
  }

  // ---------------------------------------------------------------- escolha do agente (sanfona)
  // sem agente marcado, o terminal abre só com o shell
  const AGENTS = [
    { id: 'claude', name: 'Claude Code', cmd: 'claude', mono: 'Cl', v: 'claude' },
    { id: 'codex', name: 'Codex', cmd: 'codex', mono: 'Cx', v: 'codex' },
    { id: 'gemini', name: 'Gemini CLI', cmd: 'gemini', mono: 'Ge', v: 'gemini' },
    { id: 'antigravity', name: 'Antigravity', cmd: 'antigravity', mono: 'Ag', v: 'anti' },
  ];
  const NO_AGENT = { id: '', name: 'Nenhum agente', cmd: 'abre só o terminal', mono: '>_', v: 'none' };
  const acc = $('#agentAcc'), agentList = $('#agentList'), agentTrigger = $('#agentTrigger');

  function icoStyle(el, a) {
    el.textContent = a.mono;
    el.style.background = `var(--ag-${a.v}-bg)`;
    el.style.color = `var(--ag-${a.v}-fg)`;
  }

  agentList.innerHTML = AGENTS.map((a) => `
    <button type="button" class="ag-opt" data-agent="${a.id}" aria-pressed="false">
      <span class="mono-ico"></span><span class="n">${a.name}</span><span class="cmd">${a.cmd}</span><span class="check">${ICONS.check}</span>
    </button>`).join('') + '<div class="acc-note">Sem agente marcado, abre só o terminal. Clique de novo para desmarcar.</div>';
  agentList.querySelectorAll('.ag-opt').forEach((b) => icoStyle(b.querySelector('.mono-ico'), AGENTS.find((a) => a.id === b.dataset.agent)));

  function setAccOpen(open) {
    acc.classList.toggle('open', open);
    agentTrigger.setAttribute('aria-expanded', String(open));
  }
  function setAgent(id) {
    form.agent.value = id;
    const a = AGENTS.find((x) => x.id === id) || NO_AGENT;
    icoStyle($('#agentIco'), a);
    $('#agentName').textContent = a.name;
    $('#agentCmd').textContent = a.cmd;
    agentList.querySelectorAll('.ag-opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.agent === id)));
  }
  agentTrigger.addEventListener('click', () => setAccOpen(!acc.classList.contains('open')));
  agentList.addEventListener('click', (e) => {
    const b = e.target.closest('.ag-opt');
    if (!b) return;
    if (form.agent.value === b.dataset.agent) setAgent('');   // clicar de novo desmarca
    else { setAgent(b.dataset.agent); setAccOpen(false); }
  });

  // ---------------------------------------------------------------- novo terminal
  const dlgNew = $('#dlgNew');
  const form = $('#form');
  let gitInfo = null;

  function openNewDialog() {
    form.reset();
    wtNameEdited = false;
    gitInfo = null;
    $('#formErr').textContent = '';
    setAgent('');
    setAccOpen(true);
    renderGit();
    // com o projeto da sessão definido, o terminal só escolhe onde abrir nele
    const project = cur().project;
    showProjectField(!project);
    $('#projectInfo span').textContent = project ? `Projeto: ${shortPath(project)}` : '';
    if (project) { form.dir.value = project; checkDir(); }
    dlgNew.showModal();
    (project ? form.where : form.dir).focus();
  }

  // o campo de pasta só aparece sem projeto na sessão, ao clicar em Trocar ou se a pasta do projeto sumiu
  function showProjectField(on) {
    $('#dirRow').hidden = !on;
    $('#projectInfo').hidden = on;
  }
  $('#btnChangeProject').addEventListener('click', () => { showProjectField(true); form.dir.focus(); form.dir.select(); });

  function renderGit() {
    const where = form.where;
    const hint = $('#gitHint');
    where.innerHTML = '<option value="here">Na pasta do projeto</option>';
    where.disabled = true;
    hint.textContent = '';
    if (gitInfo && !gitInfo.exists) { hint.textContent = 'Pasta não encontrada.'; showProjectField(true); }
    else if (gitInfo && !gitInfo.repo) hint.textContent = 'Não é um repositório Git: o terminal abre na pasta.';
    else if (gitInfo) {
      const r = gitInfo.repo;
      where.options[0].textContent = `Na pasta do projeto${r.currentBranch && r.top === r.root ? ` (${r.currentBranch})` : ''}`;
      for (const wt of r.worktrees) {
        where.add(new Option(`Worktree ${basename(wt.path)}${wt.branch ? ` (${wt.branch})` : ''}`, 'wt:' + wt.path));
      }
      where.add(new Option('Novo worktree com branch nova…', 'new'));
      // o Git não deixa a mesma branch aberta em dois worktrees
      const taken = new Set([r.currentBranch, ...r.worktrees.map((wt) => wt.branch)]);
      const free = r.branches.filter((b) => !taken.has(b));
      const pick = new Option(`Novo worktree de branch existente…${free.length ? '' : ' (nenhuma livre)'}`, 'existing');
      pick.disabled = !free.length;
      where.add(pick);
      form.existingBranch.innerHTML = '';
      for (const b of free) form.existingBranch.add(new Option(b, b));
      // a branch nova parte da principal, mesmo que a pasta do projeto esteja em outra branch
      form.baseBranch.innerHTML = '';
      for (const b of r.branches) form.baseBranch.add(new Option(b, b));
      form.baseBranch.value = r.branches.includes(r.mainBranch) ? r.mainBranch : r.currentBranch || r.branches[0] || '';
      where.disabled = false;
    }
    renderWhere();
  }

  function renderWhere() {
    const isNew = form.where.value === 'new';
    const isExisting = form.where.value === 'existing';
    $('#branchRow').hidden = !isNew;
    $('#baseRow').hidden = !isNew || !form.baseBranch.options.length;
    $('#branchPickRow').hidden = !isExisting;
    $('#wtNameRow').hidden = !isNew && !isExisting;
    renderWtName();
    form.branch.required = isNew;
  }

  // o nome da worktree vem preenchido com <projeto>-<branch> e acompanha a branch até a pessoa editá-lo
  let wtNameEdited = false;
  function renderWtName() {
    if (wtNameEdited) return;
    const branch = form.where.value === 'new' ? form.branch.value.trim() : form.existingBranch.value;
    const repo = gitInfo && gitInfo.repo ? basename(gitInfo.repo.root) : '';
    form.worktreeName.value = branch && repo ? `${repo}-${branch.replace(/[\\/:*?"<>| ]+/g, '-')}` : '';
  }

  let dirTimer = null;
  function checkDir() {
    clearTimeout(dirTimer);
    dirTimer = setTimeout(async () => {
      const dir = form.dir.value.trim();
      if (!dir) { gitInfo = null; return renderGit(); }
      try {
        const info = await api('GET', `/api/git?dir=${encodeURIComponent(dir)}`);
        if (form.dir.value.trim() === dir) { gitInfo = info; renderGit(); }
      } catch (err) { $('#formErr').textContent = err.message; }
    }, 250);
  }

  form.dir.addEventListener('input', checkDir);
  form.where.addEventListener('change', renderWhere);
  form.branch.addEventListener('input', renderWtName);
  form.worktreeName.addEventListener('input', () => { wtNameEdited = form.worktreeName.value.trim() !== ''; });
  form.existingBranch.addEventListener('change', renderWtName);
  for (const btn of document.querySelectorAll('.browse')) {
    if (!app) { btn.hidden = true; continue; }
    const input = btn.closest('.row').querySelector('input');
    btn.addEventListener('click', async () => {
      const dir = await app.pickFolder(input.value.trim() || undefined);
      if (dir) { input.value = dir; input.dispatchEvent(new Event('input')); }
    });
  }
  $('#btnCancelNew').addEventListener('click', () => dlgNew.close());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const where = form.where.value;
    const view = cur().view;
    const w = 720, h = 440;
    const offset = (sessionNodes(cur()).length % 5) * 30;
    const body = {
      sessionId: active,
      agent: form.agent.value,
      dir: where.startsWith('wt:') ? where.slice(3) : form.dir.value.trim(),
      project: form.dir.value.trim(),
      worktreeBranch: where === 'new' ? form.branch.value.trim() : where === 'existing' ? form.existingBranch.value : '',
      newBranch: where === 'new',
      baseBranch: where === 'new' ? form.baseBranch.value : '',
      worktreeName: where === 'new' || where === 'existing' ? form.worktreeName.value.trim() : '',
      x: (viewport.clientWidth / 2 - view.x) / view.s - w / 2 + offset,
      y: (viewport.clientHeight / 2 - view.y) / view.s - h / 2 + offset,
    };
    $('#btnOpen').disabled = true;
    $('#formErr').textContent = '';
    try {
      // outra pasta escolhida em Trocar vira o projeto da sessão
      const s = cur();
      if (s.project && body.project && body.project !== s.project) {
        await api('PATCH', `/api/sessions/${s.id}`, { project: body.project });
      }
      const cfg = await api('POST', '/api/terminals', body);
      dlgNew.close();
      const n = nodes.get(cfg.id);
      if (n) { activate(n); n.term.focus(); } else pendingFocus = cfg.id;
    } catch (err) {
      $('#formErr').textContent = err.message;
    } finally {
      $('#btnOpen').disabled = false;
    }
  });

  // ---------------------------------------------------------------- finalizar
  const dlgFinish = $('#dlgFinish');
  let finishing = null;

  async function openFinish(n) {
    let info;
    try { info = await api('GET', `/api/terminals/${n.cfg.id}/finish-info`); } catch (err) { return toast(err.message); }
    finishing = n;
    $('#finishTitle').textContent = n.cfg.name ? `Finalizar “${n.cfg.name}”` : 'Finalizar terminal';
    $('#finishErr').textContent = '';
    $('#btnDeleteWt').hidden = !info.worktree;
    $('#btnOnlyClose').textContent = info.worktree ? 'Só fechar o terminal' : 'Fechar terminal';
    $('#finishText').textContent = info.worktree
      ? `O terminal está no worktree ${shortPath(info.worktree)}${info.branch ? ` (${info.branch})` : ''}. Você pode só fechar o terminal ou fechar e excluir o worktree e a branch. A exclusão só acontece se nenhum trabalho for perdido.`
      : 'O processo do terminal e do agente será encerrado.';
    dlgFinish.showModal();
  }

  async function finish(deleteWorktree) {
    const n = finishing;
    $('#finishErr').textContent = '';
    for (const b of dlgFinish.querySelectorAll('button')) b.disabled = true;
    try {
      await api('POST', `/api/terminals/${n.cfg.id}/finish`, { deleteWorktree });
      dlgFinish.close();
    } catch (err) {
      if (err.reasons) {
        $('#finishErr').textContent = `Não é possível excluir:\n${err.reasons.map((r) => '• ' + r).join('\n')}\nVocê ainda pode só fechar o terminal.`;
      } else {
        dlgFinish.close();
        toast(err.message);
      }
    } finally {
      for (const b of dlgFinish.querySelectorAll('button')) b.disabled = false;
    }
  }

  $('#btnOnlyClose').addEventListener('click', () => finish(false));
  $('#btnDeleteWt').addEventListener('click', () => finish(true));
  $('#btnCancelFinish').addEventListener('click', () => dlgFinish.close());

  // ---------------------------------------------------------------- barra e atalhos
  let pendingSession = null;
  $('#btnNew').onclick = openNewDialog;
  $('#btnConnect').onclick = () => setMode(mode === 'connect' ? null : 'connect');
  $('#btnNote').onclick = () => setMode(mode === 'note' ? null : 'note');
  // nova sessão: o projeto é escolhido aqui, e os terminais dela abrem nele
  const dlgSession = $('#dlgSession');
  const sessionForm = $('#sessionForm');
  $('#btnAddSession').onclick = () => {
    sessionForm.reset();
    $('#sessionErr').textContent = '';
    dlgSession.showModal();
    sessionForm.dir.focus();
  };
  $('#btnCancelSession').addEventListener('click', () => dlgSession.close());
  sessionForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#btnCreateSession').disabled = true;
    $('#sessionErr').textContent = '';
    try {
      const s = await api('POST', '/api/sessions', { project: sessionForm.dir.value.trim() });
      dlgSession.close();
      pendingSession = s.id;
      if (sessions.has(s.id)) switchTo(s.id);
    } catch (err) {
      $('#sessionErr').textContent = err.message;
    } finally {
      $('#btnCreateSession').disabled = false;
    }
  });
  $('#btnFit').onclick = fitAll;
  $('#btnZoomIn').onclick = () => zoomAt(1.2, viewport.clientWidth / 2, viewport.clientHeight / 2);
  $('#btnZoomOut').onclick = () => zoomAt(1 / 1.2, viewport.clientWidth / 2, viewport.clientHeight / 2);
  $('#btnQuit').onclick = () => (app ? app.quit() : toast('Feche o aplicativo pelo menu do sistema.'));

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && mode) { e.preventDefault(); e.stopPropagation(); setMode(null); }
  }, true);

  window.addEventListener('keydown', (e) => {
    const typing = e.target.closest && (e.target.closest('.xterm') || e.target.matches('input, select, textarea, [contenteditable="true"]'));
    if (typing || dlgNew.open || dlgSession.open || dlgFinish.open || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openNewDialog(); }
    if (k === 'c') { e.preventDefault(); setMode(mode === 'connect' ? null : 'connect'); }
    if (k === 'a') { e.preventDefault(); setMode(mode === 'note' ? null : 'note'); }
    if (k === 'f') fitAll();
  });

  // ---------------------------------------------------------------- início
  function listen() {
    const ws = new WebSocket(`ws://${location.host}/events`);
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.t === 'state') {
        reconcile(m.state);
        if (pendingSession && sessions.has(pendingSession)) { switchTo(pendingSession); pendingSession = null; }
      }
      if (m.t === 'warn') toast(m.msgs.join('\n'));
    };
    ws.onclose = () => setTimeout(listen, 1000);
  }

  api('GET', '/api/defaults').then((d) => { defaults = d; listen(); })
    .catch(() => toast('Não consegui falar com o servidor do Orquestra.'));
})();
</script>
</body>
</html>
